<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Přihlášení – právní případy SVJ</title>
  <style>
    :root{--accent:#0b57d0;--bg:#f4f5f7;--card:#fff;--ink:#1b1b1f;--line:#dfe3e8;--muted:#5f6368;--red:#b3261e;--green:#2e7d32}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(135deg,#eef3ff,var(--bg));color:var(--ink)}
    main{width:min(520px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(31,42,68,.12);padding:24px}
    h1{margin:0 0 8px;font-size:1.45rem}.muted{color:var(--muted);font-size:.92rem}label{display:block;font-weight:700;margin:14px 0 6px}input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}.row label{display:inline-flex;align-items:center;gap:7px;margin:0;font-weight:400}.row input[type=checkbox]{width:auto}button,a.button{font:inherit;padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);text-decoration:none;cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}.msg{margin-top:12px;font-weight:700}.err{color:var(--red)}.ok{color:var(--green)}code{background:#eef1f5;padding:1px 5px;border-radius:5px}.hint{margin-top:16px;padding:10px;border:1px dashed var(--line);border-radius:10px;background:#fbfcff}.captcha-box{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fbfcff}.captcha-row{display:flex;gap:8px;align-items:center}.captcha-row input{flex:1}.captcha-question{font-weight:700;white-space:nowrap}.captcha-refresh{padding:10px 12px}
  </style>
</head>
<body>
<main>
  <h1>Přihlášení do právních případů</h1>
  <p class="muted">Zadejte login a heslo. Role se určí automaticky podle loginu. Bez platného přihlášení se index nezobrazí.</p>
  <label for="username">Login</label>
  <input id="username" autocomplete="username" placeholder="Login">
  <label for="password">Heslo</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="Heslo">
  <div class="captcha-box">
    <label for="captchaAnswer">Ověření</label>
    <div class="captcha-row">
      <span id="captchaQuestion" class="captcha-question"></span>
      <input id="captchaAnswer" inputmode="numeric" autocomplete="off" placeholder="Výsledek">
      <button class="captcha-refresh" type="button" onclick="newCaptcha()" title="Nová otázka">↻</button>
    </div>
  </div>
  <div class="row">
    <label><input id="remember" type="checkbox"> pamatovat 8 hodin</label>
  </div>
  <div class="row">
    <button class="primary" type="button" onclick="submitLogin()">Přihlásit</button>
  </div>
  <div id="message" class="msg"></div>
  <div class="hint muted">Pozn.: u statické HTML stránky jde o lokální ochranu UI v prohlížeči, nikoli o serverovou autentizaci.</div>
</main>
<script>
const SESSION_KEY='pravni_pripady_login_session_v2';
const ROLE_KEY='pravni_pripady_role_v2';
const ROLE_ACCOUNTS={
  admin:{username:'admin',passwordHash:'45eb06a239fae53624e74c5ada6bf8c9d6fc41c7b4df37b797df08698c5a96da'},
  'advokat-a':{username:'advokat-a',passwordHash:'cf914427ac9028b2e7e49fd3d09034bbc9dcfb7ff6af3c340a52fd1a1f26b86d'},
  'advokat-b':{username:'advokat-b',passwordHash:'62fa6e4a3b07606ca72698e1f17b3cc488a2eff4047ae6be06c69dae9becf443'}
};
let captchaExpected=null;
function roleLabel(role){return ({admin:'admin','advokat-a':'advokát strany A','advokat-b':'advokát strany B',viewer:'viewer'})[role]||role;}
function roleByUsername(username){return Object.keys(ROLE_ACCOUNTS).find(role=>ROLE_ACCOUNTS[role].username===username)||null;}
function newCaptcha(){const a=2+Math.floor(Math.random()*8); const b=2+Math.floor(Math.random()*8); captchaExpected=a+b; const q=document.getElementById('captchaQuestion'); const ans=document.getElementById('captchaAnswer'); if(q)q.textContent=a+' + '+b+' ='; if(ans)ans.value='';}
function captchaOk(){const raw=(document.getElementById('captchaAnswer')?.value||'').trim(); return raw!==''&&Number(raw)===captchaExpected;}
async function hashText(text){const enc=new TextEncoder().encode(text); const digest=await crypto.subtle.digest('SHA-256',enc); return [...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('');}
function setMsg(text,ok=false){const el=document.getElementById('message'); el.textContent=text; el.className='msg '+(ok?'ok':'err');}
async function submitLogin(){const username=document.getElementById('username').value.trim(); const password=document.getElementById('password').value; const role=roleByUsername(username); const account=role?ROLE_ACCOUNTS[role]:null; if(!account){setMsg('Neplatný login.'); newCaptcha(); return;} if(!captchaOk()){setMsg('Neplatné ověření. Spočítejte příklad znovu.'); newCaptcha(); return;} const hash=await hashText(password); if(hash!==account.passwordHash){setMsg('Neplatné heslo.'); newCaptcha(); return;} const remember=document.getElementById('remember').checked; const ttl=remember?8*60*60*1000:2*60*60*1000; localStorage.setItem(SESSION_KEY,JSON.stringify({role,username,loginAt:new Date().toISOString(),expiresAt:Date.now()+ttl})); localStorage.setItem(ROLE_KEY,role); setMsg('Přihlášeno jako '+roleLabel(role)+'. Přesměrovávám…',true); setTimeout(()=>{location.href='index.html';},350);}
document.addEventListener('keydown',e=>{if(e.key==='Enter')submitLogin();});
document.getElementById('username').focus();
newCaptcha();
</script>
</body>
</html>
